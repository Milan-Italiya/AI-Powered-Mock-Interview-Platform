<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24104f"/>
      <stop offset="100%" stop-color="#0d061f"/>
    </linearGradient>

    <!-- Logo gradient -->
    <linearGradient id="sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eee5ff"/>
      <stop offset="100%" stop-color="#b98cff"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    width="64"
    height="64"
    rx="15"
    fill="url(#bg)"
  />

  <!-- Purple glowing border -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="14"
    fill="none"
    stroke="#7c3cff"
    stroke-width="1.5"
    filter="url(#glow)"
  />

  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="13"
    fill="none"
    stroke="#6d28d9"
    stroke-width="0.7"
  />

  <!-- Main sparkle glow -->
  <path
    d="
      M32 16
      C33.2 23.8 34.8 27.2 39.5 29.8
      C42.1 31.2 45.5 31.7 50 32
      C45.5 32.3 42.1 32.8 39.5 34.2
      C34.8 36.8 33.2 40.2 32 48
      C30.8 40.2 29.2 36.8 24.5 34.2
      C21.9 32.8 18.5 32.3 14 32
      C18.5 31.7 21.9 31.2 24.5 29.8
      C29.2 27.2 30.8 23.8 32 16
      Z
    "
    fill="none"
    stroke="#9b5cff"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#strongGlow)"
    opacity="0.8"
  />

  <!-- Main sparkle -->
  <path
    d="
      M32 16
      C33.2 23.8 34.8 27.2 39.5 29.8
      C42.1 31.2 45.5 31.7 50 32
      C45.5 32.3 42.1 32.8 39.5 34.2
      C34.8 36.8 33.2 40.2 32 48
      C30.8 40.2 29.2 36.8 24.5 34.2
      C21.9 32.8 18.5 32.3 14 32
      C18.5 31.7 21.9 31.2 24.5 29.8
      C29.2 27.2 30.8 23.8 32 16
      Z
    "
    fill="none"
    stroke="url(#sparkle)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Small sparkle glow -->
  <path
    d="
      M47 18
      C47.5 20.8 48.2 21.5 51 22
      C48.2 22.5 47.5 23.2 47 26
      C46.5 23.2 45.8 22.5 43 22
      C45.8 21.5 46.5 20.8 47 18
      Z
    "
    fill="#b98cff"
    filter="url(#glow)"
  />

  <!-- Small sparkle -->
  <path
    d="
      M47 18
      C47.5 20.8 48.2 21.5 51 22
      C48.2 22.5 47.5 23.2 47 26
      C46.5 23.2 45.8 22.5 43 22
      C45.8 21.5 46.5 20.8 47 18
      Z
    "
    fill="#eee5ff"
  />

  <!-- Bottom-left glowing circle -->
  <circle
    cx="20"
    cy="45"
    r="4"
    fill="none"
    stroke="#a875ff"
    stroke-width="2.5"
    filter="url(#glow)"
  />

  <!-- Inner highlight -->
  <circle
    cx="20"
    cy="45"
    r="4"
    fill="none"
    stroke="#eee5ff"
    stroke-width="1.5"
  />
</svg>